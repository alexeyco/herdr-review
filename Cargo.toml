[package]
name = "herdr-review"
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.1"
description = "herdr plugin that runs a review tool in a new tab and passes review annotations to the agent"
repository = "https://github.com/alexeyco/herdr-review"
readme = "README.md"
keywords = ["herdr", "review", "plugin", "cli", "code-review"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
mockall = "0.14"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[lints.clippy]
all = "warn"
